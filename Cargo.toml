[package]
name = "oc-deps"
version = "0.1.0"
edition = "2024"

[dependencies]
kube = { version = "3", features = ["derive", "runtime"] }
k8s-openapi = { version = "0.27", default-features = false, features = ["v1_35"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde_json = "1"
sha2 = "0.10"
dirs = "6"
libc = "0.2"
atty = "0.2"
ratatui = "0.29"
crossterm = "0.28"
tokio-util = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tower-test = "0.4"
http = "1"
